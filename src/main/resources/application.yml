spring:
  application:
    name: doorstep-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  shutdown: graceful

booking:
  time-zone: Asia/Kolkata
  slot-granularity: 30m
  travel-buffer: 30m
  min-lead-time: 2h
  max-horizon: 7d
  cancellation-cutoff: 1h
  rate-limit:
    enabled: true
    capacity: 20
    refill-per-minute: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [rid=%X{requestId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
